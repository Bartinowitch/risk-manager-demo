<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <rect width="220" height="220" rx="48" fill="#157a4a"/>
  <g transform="translate(55,55) scale(1.964)">
    <g id="sway">
      <!-- Stem grows upward -->
      <path d="M28 46 L28 46" stroke="#fff" stroke-width="4.5" stroke-linecap="round" fill="none">
        <animate attributeName="d"
          values="M28 46 L28 46;M28 46 L28 26"
          dur="0.45s" begin="0.1s" fill="freeze"
          calcMode="spline" keySplines="0.4 0 0.2 1"/>
      </path>
      <!-- Left leaf unfolds -->
      <path fill="#fff" d="M28 26C28 14 20 9 10 10C11.5 21 19 26 28 26Z" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.25s" begin="0.5s" fill="freeze"/>
      </path>
      <!-- Right leaf unfolds, slight delay -->
      <path fill="#fff" d="M28 26C28 14 36 9 46 10C44.5 21 37 26 28 26Z" opacity="0">
        <animate attributeName="opacity" values="0;1" dur="0.25s" begin="0.68s" fill="freeze"/>
      </path>
      <!-- Gentle sway loop, starts after grow -->
      <animateTransform attributeName="transform" type="rotate"
        values="0 28 46;2 28 46;0 28 46;-2 28 46;0 28 46"
        dur="4s" repeatCount="indefinite" begin="1.2s"
        calcMode="spline"
        keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>
    </g>
  </g>
</svg>
